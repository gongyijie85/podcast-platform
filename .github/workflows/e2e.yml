name: E2E Tests

on:
  schedule:
    # 每周一 UTC 03:00（北京时间周一 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run database migrations
        run: pnpm --filter backend prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/podcast

      - name: Run backend E2E tests
        run: pnpm --filter backend test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/podcast
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-e2e-secret-do-not-use-in-production
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: podcast
          MINIO_USE_SSL: 'false'
          ALLOW_LOCAL_DB_E2E: '1'
          LOCAL_FULL_E2E: '1'
