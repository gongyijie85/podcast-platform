version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: podcast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: podcast
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: podcast-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: podcast-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: podcast-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/podcast
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: please-change-me-in-production
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: podcast
      MINIO_USE_SSL: 'false'
      PORT: 3001
      CORS_ORIGINS: 'http://localhost:5173,http://localhost:3000'
      STORAGE_DRIVER: minio
      OPENLIBRARY_BASE: https://openlibrary.org
      GOOGLE_BOOKS_BASE: https://www.googleapis.com/books/v1
    ports:
      - '3001:3001'
    volumes:
      - backend-storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: podcast-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'
    volumes:
      - frontend-dist:/usr/share/nginx/html

volumes:
  pgdata:
  redisdata:
  miniodata:
  backend-storage:
  frontend-dist:
