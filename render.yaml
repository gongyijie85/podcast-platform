services:
  - type: web
    name: podcast-platform-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: CORS_ORIGINS
        sync: false  # user configures in dashboard
      - key: JWT_SECRET
        generateValue: true
    buildCommand: ''
    startCommand: ''
