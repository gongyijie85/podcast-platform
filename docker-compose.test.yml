version: '3.9'

# 仅供测试使用：一键启动 Postgres + Redis + MinIO。
# 运行前请确保本地 5432/6379/9000/9001 端口未被占用，
# 或先执行 docker compose -f docker-compose.yml down。
services:
  postgres:
    image: postgres:15-alpine
    container_name: podcast-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: podcast
    ports:
      - '5432:5432'
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: podcast-redis-test
    ports:
      - '6379:6379'
    volumes:
      - redisdata_test:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: podcast-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata_test:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_test:
  redisdata_test:
  miniodata_test:
